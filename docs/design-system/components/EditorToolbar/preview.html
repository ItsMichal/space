<!-- @dsCard group="Writing tool" height=160 -->
<div class="wrap">
  <div class="lg tb" id="tb" role="toolbar" aria-label="Formatting">
    <button aria-pressed="true" title="Bold"><b>B</b></button>
    <button title="Italic"><i style="font-family:var(--font-serif)">I</i></button>
    <button title="Link">↗</button>
    <span class="div"></span>
    <button title="Heading 2">H2</button>
    <button title="Heading 3">H3</button>
    <button title="Quote">“</button>
    <button title="Code">{ }</button>
    <span class="div"></span>
    <span class="status">Saved · 2s ago</span>
    <button class="lg-btn lg-btn--solid pub">Publish</button>
  </div>
</div>
<style>
  .wrap { display: flex; justify-content: center; padding: 48px 16px; background: var(--paper);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.4px); background-size: 12px 12px; }
  .tb { display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 20px; }
  .tb button:not(.pub) { min-width: 36px; height: 36px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); font: 500 14px/1 var(--font-sans); cursor: pointer; }
  .tb button:not(.pub):hover { background: var(--paper-sunk); }
  .tb button[aria-pressed="true"] { background: var(--paper-raised); }
  .div { width: 1px; height: 22px; background: var(--hairline); margin: 0 6px; }
  .status { font: 400 13px/18px var(--font-mono); color: var(--ink-muted); margin: 0 10px; }
  .pub { padding: 8px 16px; }
</style>
<script>requestAnimationFrame(function () { Paper.liquidGlass(document.getElementById('tb'), { bezel: 16 }); });</script>
