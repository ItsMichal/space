<!-- @dsCard group="Material" height=340 subtitle="Refraction in Chromium, frost elsewhere" -->
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <span>Paper</span><span>scan</span><span>glass</span><span>paper</span><span>trail</span><span>lidar</span>
  </div>
  <div class="lg panel" id="g1">
    <div class="eyebrow">Liquid glass</div>
    <div class="t">Bends what's behind it</div>
  </div>
  <div class="lg lg--pill chip" id="g2">Pill · radius-pill</div>
</div>
<style>
  .stage { position: relative; height: 340px; overflow: hidden; background: var(--paper);
    background-image: radial-gradient(var(--ink-faint) 1.2px, transparent 1.4px); background-size: 12px 12px; }
  .backdrop { position: absolute; inset: 0; display: flex; flex-wrap: wrap; gap: 4px 24px; padding: 24px; align-content: center;
    font: 600 56px/1 var(--font-sans); letter-spacing: -0.03em; color: var(--ink); }
  .backdrop span:nth-child(2) { color: var(--accent); }
  .backdrop span:nth-child(5) { color: var(--presence-2); }
  .panel { position: absolute; left: 48px; top: 64px; width: 320px; height: 150px; padding: 24px; box-sizing: border-box; }
  .panel .t { font: 600 21px/1.25 var(--font-sans); margin-top: 8px; }
  .chip { position: absolute; left: 420px; top: 200px; padding: 14px 22px; font: 500 16px/24px var(--font-sans); }
</style>
<script>
  requestAnimationFrame(function () {
    Paper.liquidGlass(document.getElementById('g1'));
    Paper.liquidGlass(document.getElementById('g2'), { bezel: 18 });
  });
</script>
