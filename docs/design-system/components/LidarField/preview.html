<!-- @dsCard group="Background" height=380 subtitle="Simulated peers" -->
<div class="field">
  <canvas id="c"></canvas>
  <div class="lg lg--pill presence tag" id="tag"><span class="presence__dots"><i class="presence__dot" style="background:var(--presence-1)"></i><i class="presence__dot" style="background:var(--presence-2)"></i><i class="presence__dot" style="background:var(--presence-3)"></i></span>3 here now</div>
</div>
<style>
  .field { position: relative; height: 380px; background: var(--paper); overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tag { position: absolute; left: 20px; bottom: 20px; color: var(--ink-muted); }
</style>
<script>
  (function () {
    var c = document.getElementById('c');
    var peers = [
      { colorVar: '--presence-1', trail: [], ph: 0 },
      { colorVar: '--presence-2', trail: [], ph: 2.1 },
      { colorVar: '--presence-3', trail: [], ph: 4.2 }
    ];
    var field = Paper.lidarField(c, { pitch: 12, peers: peers });
    var t = 0;
    setInterval(function () {
      t += 0.066;
      peers.forEach(function (p, i) {
        var x = 0.5 + 0.34 * Math.sin(t * (0.6 + i * 0.13) + p.ph);
        var y = 0.5 + 0.28 * Math.sin(t * (0.9 + i * 0.07) + p.ph * 1.7);
        p.trail.push([x, y]);
        if (p.trail.length > 40) p.trail.shift();
      });
      field.setPeers(peers);
    }, 66);
    requestAnimationFrame(function () { Paper.liquidGlass(document.getElementById('tag'), { bezel: 14 }); });
  })();
</script>
