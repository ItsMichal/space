name: CI

# Verification only. Nothing here deploys; merges to main deploy through deploy.yml
# (see "Deploying" in the root README). Shared steps live in .github/actions/.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      michal: ${{ steps.f.outputs.michal }}
      halmic: ${{ steps.f.outputs.halmic }}
      sports: ${{ steps.f.outputs.sports }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            michal:
              - 'apps/michal-ai/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            halmic:
              - 'apps/halmic/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            sports:
              - 'apps/sports/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  checks:
    # typecheck + lint + unit tests + identity check for the whole workspace; cheap, always runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/checks

  build-michal:
    needs: changes
    if: needs.changes.outputs.michal == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Pull requests from forks get no secrets, so they build with the content in this repo.
      - uses: ./.github/actions/content
        with:
          deploy-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          token: ${{ secrets.CONTENT_TOKEN }}
      - uses: ./.github/actions/media-cache
      - name: Prerender the site (react-router build) and generate share cards
        run: npm run build:michal
      - name: Worker config sanity (no upload)
        working-directory: apps/michal-ai
        run: npx wrangler deploy --dry-run

  build-halmic:
    needs: changes
    if: needs.changes.outputs.halmic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is halmic present yet?
        id: present
        run: |
          if [ -f apps/halmic/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/setup
        if: steps.present.outputs.present == 'true'
      - if: steps.present.outputs.present == 'true'
        run: npm run build:halmic
      - if: steps.present.outputs.present == 'true'
        run: npm run check:identity
      - name: Worker config sanity (no upload)
        if: steps.present.outputs.present == 'true'
        working-directory: apps/halmic
        run: npx wrangler deploy --dry-run

  build-sports:
    needs: changes
    if: needs.changes.outputs.sports == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Worker config sanity (no upload)
        working-directory: apps/sports
        run: npx wrangler deploy --dry-run
